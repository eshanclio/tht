services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roofr-app
    volumes:
      - ./src:/var/www
    env_file:
      - .env
    environment:
      - UID=${UID:-1000}
      - GID=${GID:-1000}
    depends_on:
      - db
      - redis
    networks:
      - roofr

  nginx:
    image: nginx:alpine
    container_name: roofr-nginx
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - roofr

  db:
    image: postgres:18-alpine
    container_name: roofr-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - roofr

  redis:
    image: redis:8-alpine
    container_name: roofr-redis
    ports:
      - "6379:6379"
    networks:
      - roofr

volumes:
  db_data:

networks:
  roofr:
    driver: bridge
